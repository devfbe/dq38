# dq38 configuration: one KEY=value per line, numbers in decimal or 0x hex.
# Lines that do not start with a known key (like these comments) are ignored.
# Delete or comment out a line to get the default shown here.

# Run time in seconds. A pass is always finished, so the run can be a bit longer.
SECONDS=600

# How often each written pattern is read back and compared.
READS=3

# Bit mask of the patterns to use: 1 = zero, 2 = ones, 4 = alt (00/FF every 8 bytes),
# 8 = alt-inv. 15 = all four.
PATTERNS=15

# 0 = wait for a key at the end and return to the firmware (interactive use).
# 1 = cold reset 5 s after the end (unattended runs, e.g. a cold-start loop).
RESET=0

# Idle experiments (off by default): let the CPU sleep so the memory controller can
# put the DIMMs into power-down / self-refresh, then test the first read after wake-up.
# IDLE=n      sleep n seconds between writing and each read-back
# IDLE_MS=n   sleep n milliseconds before verifying each map cell
# ALT=1       idle only on odd passes, so idle and busy passes can be compared
# PARK=0      do not park the other cores in MWAIT during idle runs (default 1)
# MWAIT=0x60  MWAIT C-state hint (Intel); HLT=1 uses HLT instead of MWAIT

# Self-test: flip one stored bit on this data line (0..63) after the first write pass.
# The run must then report exactly that DQ line. Used by the QEMU check in CI.
# INJECT=38
