name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build dq38.efi and the USB image
        run: |
          nix build -L .#dq38 --out-link efi
          nix build -L .#image --out-link img
          mkdir dist
          cp efi/dq38.efi dist/dq38.efi
          cp img dist/dq38-usb.img
          (cd dist && sha256sum dq38.efi dq38-usb.img > SHA256SUMS)
      - name: QEMU self-test (fault injected on DQ38)
        run: nix flake check -L
      - uses: actions/upload-artifact@v4
        with:
          name: dq38
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dq38
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "dq38 $GITHUB_REF_NAME" --generate-notes
